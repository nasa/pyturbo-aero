[project]
name = "pyturbo-aero"
version = "1.3.8"
description = "PyTurbo_Aero is a Turbomachinery blade design library that lets you create a full 3D blades and passages."
authors = [
    { name = "Paht Juangphanich", email = "paht.juangphanich@nasa.gov" }
]
requires-python = ">=3.10"
dependencies = [
    "plotly",
    "tqdm",
    "scipy",
    "pandas",
    "numpy",
    "matplotlib",
    "numpy-stl",
    "shapely",
    "requests"
]

[dependency-groups]
dev = ["pytest"]
docs = ["sphinx>=7.4,<8", "sphinx-rtd-theme>=2.0,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyturbo"]
