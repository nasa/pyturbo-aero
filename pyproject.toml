[project]
name = "pyturbo-aero"
version = "1.3.5"
description = "PyTurbo_Aero is a Turbomachinery blade design library that lets you create a full 3D blades and passages."
authors = [
    { name = "Paht Juangphanich", email = "paht.juangphanich@nasa.gov" }
]
requires-python = ">=3.10"
dependencies = [
    "plotly",
    "tqdm",
    "scipy",
    "pandas",
    "numpy>=1.80",
    "matplotlib",
    "numpy-stl",
    "plot3d",
    "shapely",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pyturbo"]
